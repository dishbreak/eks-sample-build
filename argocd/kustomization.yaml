---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd
resources:
- ./namespace.yaml
- https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
- ./ui-service.yaml
- ./ui-ingress.yaml

patches:
- path: "./patch_argocd-server-service.yaml"
  target:
    kind: Service
    name: argocd-server
