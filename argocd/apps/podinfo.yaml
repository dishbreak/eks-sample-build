apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podinfo
  namespace: argocd
spec:
  source:
    repoURL: https://github.com/dishbreak/eks-sample-build.git
    path: gitops/podinfo
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: podinfo
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
  project: ""
